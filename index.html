<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>portofolio</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav{
            display: flex;
            justify-content: space-between;
            padding: 0px 50px;
            align-items: center;
            width: 100%;
            height: 3rem;
            color: black;
            background-color: rgb(8, 236, 225);
        

        }

        .nav ul{
            display: flex;
            list-style: none;

        }
   
        .nav ul li{
            margin-left: 5rem;
        }



    </style>
</head>
<body>

    <div class="nav">
        
        <h3>portofolio</h3>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Project</li>
        </ul>
    </div>
</body>
</html>
